name: release-dev

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  release-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: make test

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing dev release
        run: gh release delete v0.0.0-dev --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dev pre-release
        run: |
          gh release create v0.0.0-dev \
            --title "v0.0.0-dev" \
            --notes "Development build from \`develop\` branch

          Commit: ${{ github.sha }}
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          This is a pre-release for testing purposes." \
            --prerelease \
            dist/*.zip dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
