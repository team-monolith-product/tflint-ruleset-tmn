name: release-dev

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  release-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: make test

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(grep 'Version:' main.go | sed 's/.*"\(.*\)".*/\1/')
          DEV_VERSION="v${BASE_VERSION}-dev.${SHORT_SHA}"
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing dev release
        run: gh release delete ${{ steps.version.outputs.dev_version }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dev pre-release
        run: |
          gh release create ${{ steps.version.outputs.dev_version }} \
            --title "${{ steps.version.outputs.dev_version }}" \
            --notes "Development build from \`develop\` branch

          Commit: ${{ github.sha }}

          ⚠️ This is a pre-release for testing purposes." \
            --prerelease \
            dist/*.zip dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
